# render.yaml — CodeRoute Guinée P10
services:
  - type: keyvalue
    name: coderoute-shared-state
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  - type: web
    name: coderoute-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: starter
    region: frankfurt
    numInstances: 2
    healthCheckPath: /health/readiness
    maxShutdownDelaySeconds: 60
    preDeployCommand: "./scripts/predeploy.sh"
    envVars:
      - key: PYTHONPATH
        value: "/app"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: ADMIN_REGISTRATION_TOKEN
        generateValue: true
      - key: EDGE_LEASE_SIGNING_SECRET
        generateValue: true
      - key: EDGE_RELEASE_SIGNING_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: coderoute-shared-state
          property: connectionString
      - key: REDIS_REQUIRED
        value: "true"
      - key: HA_MODE
        value: "true"
      - key: EXPECTED_API_INSTANCES
        value: "2"
      - key: DEPLOYMENT_ID
        value: "production"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: RUN_BOOTSTRAP_SEED_ON_STARTUP
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: "Directeur National CodeRoute"
      - key: ENVIRONMENT
        value: "production"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: EXAM_CHECKIN_OPEN_MINUTES_BEFORE
        value: "60"
      - key: EXAM_CHECKIN_CLOSE_MINUTES_AFTER
        value: "30"
      - key: EXAM_START_OPEN_MINUTES_BEFORE
        value: "10"
      - key: EXAM_START_CLOSE_MINUTES_AFTER
        value: "45"
      - key: CORS_ORIGINS
        value: "https://coderouteguinee-frontend.onrender.com"
      - key: ALLOWED_HOSTS
        value: "coderouteguinee-backend.onrender.com"
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "noreply@coderoute.gov.gn"
      - key: EMAIL_FROM_NAME
        value: "CodeRoute Guinée — DNTT"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: "coderoute/questions"
      - key: MOBILE_MONEY_MODE
        value: "sandbox"
      - key: DB_POOL_RECYCLE
        value: "60"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "3"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

  - type: web
    name: coderoute-frontend
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://coderouteguinee-backend.onrender.com"
      - key: VITE_APP_ENV
        value: "production"
