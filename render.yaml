# render.yaml — CodeRoute Guinée P11
# Les variables marquées sync:false DOIVENT être saisies manuellement dans
# Render Dashboard → Environment avant activation de la fonction concernée.

services:
  # ── Shared state Redis/Valkey ────────────────────────────────────────────
  - type: keyvalue
    name: coderoute-shared-state
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  # ── Backend FastAPI HA ──────────────────────────────────────────────────
  - type: web
    name: coderoute-backend
    runtime: docker
    autoDeployTrigger: checksPass
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: starter
    region: frankfurt
    numInstances: 2
    healthCheckPath: /health/readiness
    maxShutdownDelaySeconds: 60
    preDeployCommand: "./scripts/predeploy.sh"
    envVars:
      - key: PYTHONPATH
        value: "/app"
      - key: WEB_CONCURRENCY
        value: "2"

      # Sécurité — valeurs partagées entre toutes les instances API.
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: ADMIN_REGISTRATION_TOKEN
        generateValue: true
      - key: EDGE_LEASE_SIGNING_SECRET
        generateValue: true
      - key: EDGE_RELEASE_SIGNING_SECRET
        generateValue: true

      # Base de données Neon/PostgreSQL.
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false

      # P10 shared state privé Render.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: coderoute-shared-state
          property: connectionString
      - key: REDIS_REQUIRED
        value: "false"
      - key: HA_MODE
        value: "true"
      - key: EXPECTED_API_INSTANCES
        value: "2"
      - key: DEPLOYMENT_ID
        value: "production"

      # P10.2 observabilité Prometheus + preuve machine PRA.
      - key: METRICS_ENABLED
        value: "true"
      - key: METRICS_TOKEN
        generateValue: true
      - key: RELIABILITY_EVIDENCE_ENABLED
        value: "true"
      - key: RELIABILITY_EVIDENCE_TOKEN
        generateValue: true
      - key: SLO_AVAILABILITY_PERCENT
        value: "99.9"
      - key: SLO_P95_LATENCY_MS
        value: "1000"
      - key: SLO_MAX_5XX_PERCENT
        value: "1.0"
      - key: DR_RPO_MINUTES
        value: "5"
      - key: DR_RTO_MINUTES
        value: "30"

      # P11 SOC — livré dormant par défaut. Provisionner d'abord les deux clés
      # stables dans le coffre, puis activer SOC_ENABLED et AUDIT_CHAIN_ENABLED.
      - key: SOC_ENABLED
        value: "false"
      - key: SOC_PSEUDONYM_KEY
        sync: false
      - key: AUDIT_CHAIN_ENABLED
        value: "false"
      - key: AUDIT_CHAIN_HMAC_KEY
        sync: false
      - key: AUDIT_VERIFY_INTERVAL_SECONDS
        value: "900"
      # OTLP reste désactivé tant qu'un collector privé n'est pas provisionné.
      - key: OTEL_TRACES_ENABLED
        value: "false"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_SERVICE_NAME
        value: "coderoute-api"
      - key: OTEL_SAMPLE_RATIO
        value: "0.05"
      # WAF/SIEM sont des prérequis d'infrastructure, jamais simulés par l'API.
      - key: WAF_REQUIRED
        value: "false"
      - key: WAF_PROVIDER
        sync: false
      - key: SIEM_REQUIRED
        value: "false"

      # Politique PRA visible par l'API, sans clé AES ni credential objet.
      - key: BACKUP_REQUIRED
        value: "true"
      - key: BACKUP_REQUIRE_OFF_REGION
        value: "true"
      - key: BACKUP_PRIMARY_REGION
        value: "frankfurt"
      - key: BACKUP_TARGET_REGION
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: "coderoute/production"
      - key: BACKUP_ENCRYPTION_KEY_ID
        sync: false

      # Migrations/seeds : jamais en concurrence au démarrage des instances.
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: RUN_BOOTSTRAP_SEED_ON_STARTUP
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"

      # Bootstrap admin — saisir dans Render Dashboard
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: "Directeur National CodeRoute"

      # Application
      - key: ENVIRONMENT
        value: "production"
      - key: ENABLE_API_DOCS
        value: "false"

      # Portique centre — paramètres opérationnels ajustables après homologation DNTT
      - key: EXAM_CHECKIN_OPEN_MINUTES_BEFORE
        value: "60"
      - key: EXAM_CHECKIN_CLOSE_MINUTES_AFTER
        value: "30"
      - key: EXAM_START_OPEN_MINUTES_BEFORE
        value: "10"
      - key: EXAM_START_CLOSE_MINUTES_AFTER
        value: "45"

      # CORS / Hosts
      - key: CORS_ORIGINS
        value: "https://coderouteguinee-frontend.onrender.com"
      - key: ALLOWED_HOSTS
        value: "coderouteguinee-backend.onrender.com"

      # Email Brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "noreply@coderoute.gov.gn"
      - key: EMAIL_FROM_NAME
        value: "CodeRoute Guinée — DNTT"

      # Media Factory Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: "coderoute/questions"

      # Mobile Money — sandbox pour le pilote
      - key: MOBILE_MONEY_MODE
        value: "sandbox"

      # Performance DB : budget par instance, avec 2 instances API.
      - key: DB_POOL_RECYCLE
        value: "60"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "3"

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

  # ── Backup logique quotidien chiffré hors région ────────────────────────
  - type: cron
    name: coderoute-offsite-backup
    runtime: docker
    autoDeployTrigger: checksPass
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: "./scripts/run_offsite_backup.sh"
    plan: starter
    region: frankfurt
    schedule: "30 1 * * *"
    envVars:
      - key: PYTHONPATH
        value: "/app"
      - key: BACKUP_DATABASE_URL
        sync: false
      - key: BACKUP_PRIMARY_REGION
        value: "frankfurt"
      - key: BACKUP_TARGET_REGION
        sync: false
      - key: BACKUP_REQUIRE_OFF_REGION
        value: "true"
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: "coderoute/production"
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_SSE_MODE
        sync: false
      - key: BACKUP_S3_KMS_KEY_ID
        sync: false
      - key: BACKUP_ENCRYPTION_KEY_B64
        sync: false
      - key: BACKUP_ENCRYPTION_KEY_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CODEROUTE_API_BASE_URL
        value: "https://coderouteguinee-backend.onrender.com"
      - key: RELIABILITY_EVIDENCE_TOKEN
        fromService:
          type: web
          name: coderoute-backend
          envVarKey: RELIABILITY_EVIDENCE_TOKEN
      - key: PUBLISH_RELIABILITY_EVIDENCE
        value: "true"

  # ── Frontend Vite ────────────────────────────────────────────────────────
  - type: web
    name: coderoute-frontend
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://coderouteguinee-backend.onrender.com"
      - key: VITE_APP_ENV
        value: "production"
