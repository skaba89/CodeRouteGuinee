name: Command Center Resilience Source Patch

on:
  pull_request:
    paths:
      - '.github/workflows/command-center-resilience-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Make endpoint collection independent and fail-closed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/NationalGoLiveCommandCenter.tsx')
          text = path.read_text(encoding='utf-8')

          old_load = '''    const load = async () => {
      try {
        const [nextReliability, nextSecurity, nextGovernance] = await Promise.all([
          getReliabilityStatus(),
          getSecurityOperationsStatus(),
          getGovernanceReadiness(),
        ]);
        if (!cancelled) {
          setReliability(nextReliability);
          setSecurity(nextSecurity);
          setGovernance(nextGovernance);
          setNowMs(Date.now());
          setError('');
        }
      } catch (err) {
        if (!cancelled) setError(err instanceof Error ? err.message : 'Command Center indisponible.');
      } finally {
        if (!cancelled) setLoading(false);
      }
    };'''
          new_load = '''    const load = async () => {
      const [reliabilityResult, securityResult, governanceResult] = await Promise.allSettled([
        getReliabilityStatus(),
        getSecurityOperationsStatus(),
        getGovernanceReadiness(),
      ]);
      if (cancelled) return;

      const failures: string[] = [];
      if (reliabilityResult.status === 'fulfilled') setReliability(reliabilityResult.value);
      else {
        setReliability(null);
        failures.push(reliabilityResult.reason instanceof Error ? reliabilityResult.reason.message : 'P10.2 indisponible');
      }
      if (securityResult.status === 'fulfilled') setSecurity(securityResult.value);
      else {
        setSecurity(null);
        failures.push(securityResult.reason instanceof Error ? securityResult.reason.message : 'P11 indisponible');
      }
      if (governanceResult.status === 'fulfilled') setGovernance(governanceResult.value);
      else {
        setGovernance(null);
        failures.push(governanceResult.reason instanceof Error ? governanceResult.reason.message : 'P12 indisponible');
      }

      setNowMs(Date.now());
      setError(failures.join(' · '));
      setLoading(false);
    };'''
          if old_load in text:
              text = text.replace(old_load, new_load, 1)
          elif 'Promise.allSettled' not in text:
              raise SystemExit('expected original command-center load block not found')

          old_status = '''  const p10Status = allPassed(p10);
  const p11Status = allPassed(p11);
  const p12Status = governance?.go_live_allowed === true && allPassed(p12) === 'pass' ? 'pass' : p12.length ? 'blocked' : 'unknown';
  const automatedReady = p10Status === 'pass' && p11Status === 'pass' && p12Status === 'pass';
  const blockerCount = [...p10, ...p11, ...p12].filter(item => item.status !== 'pass').length;'''
          new_status = '''  const p10Status = allPassed(p10);
  const p11Status = allPassed(p11);
  const p12Status = governance?.go_live_allowed === true && allPassed(p12) === 'pass' ? 'pass' : p12.length ? 'blocked' : 'unknown';
  const domainStatuses: GateStatus[] = [p10Status, p11Status, p12Status];
  const unknownCount = domainStatuses.filter(status => status === 'unknown').length;
  const automatedReady = unknownCount === 0 && domainStatuses.every(status => status === 'pass');
  const blockerCount = [...p10, ...p11, ...p12].filter(item => item.status === 'blocked').length;
  const overallLabel = automatedReady
    ? 'Gates automatisables prêts'
    : unknownCount > 0
      ? `Readiness incomplète · ${unknownCount} source(s)`
      : `${blockerCount} blocker(s)`;'''
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif 'const overallLabel =' not in text:
              raise SystemExit('expected original command-center status block not found')

          old_badge = '''        <span data-testid="national-automated-readiness" className={`badge ${automatedReady ? 'bg' : 'br'}`}>
          {automatedReady ? 'Gates automatisables prêts' : `${blockerCount} blocker(s)`}
        </span>'''
          new_badge = '''        <span data-testid="national-automated-readiness" className={`badge ${automatedReady ? 'bg' : unknownCount > 0 ? 'bgo' : 'br'}`}>
          {overallLabel}
        </span>'''
          if old_badge in text:
              text = text.replace(old_badge, new_badge, 1)
          elif '{overallLabel}' not in text:
              raise SystemExit('expected original readiness badge not found')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Add partial-outage E2E regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/tests/e2e/national-go-live-command-center.spec.ts')
          text = path.read_text(encoding='utf-8')
          marker = "command center fails closed when one readiness source is unavailable"
          if marker in text:
              raise SystemExit(0)
          text += r'''

test('command center fails closed when one readiness source is unavailable', async ({ page }) => {
  await bootstrap(page);
  await page.route('**/api/v1/operations/reliability', route => route.fulfill({
    status: 503,
    contentType: 'application/json',
    body: JSON.stringify({ detail: 'PRA indisponible' }),
  }));
  await page.route('**/api/v1/operations/security/status', route => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(security(true)) }));
  await page.route('**/api/v1/national-governance/readiness', route => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(governance(true)) }));

  await page.goto('/#/admin');
  const command = page.getByTestId('national-go-live-command-center');
  await expect(command).toBeVisible();
  await expect(page.getByTestId('national-automated-readiness')).toContainText('Readiness incomplète');
  await expect(page.getByTestId('go-live-p10').getByText('INCONNU')).toBeVisible();
  await expect(page.getByTestId('go-live-p11').getByText('PASS')).toBeVisible();
  await expect(page.getByTestId('go-live-p12').getByText('PASS')).toBeVisible();
  await expect(command.getByText('0 blocker(s)')).toHaveCount(0);
  await expect(page.getByTestId('institutional-signoff-required')).toBeVisible();
});
'''
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify resilience changes
        shell: bash
        run: |
          git diff -- frontend/src/components/NationalGoLiveCommandCenter.tsx frontend/tests/e2e/national-go-live-command-center.spec.ts
          python - <<'PY'
          from pathlib import Path
          component = Path('frontend/src/components/NationalGoLiveCommandCenter.tsx').read_text(encoding='utf-8')
          assert 'Promise.allSettled' in component
          assert 'Readiness incomplète' in component
          assert 'const overallLabel =' in component
          spec = Path('frontend/tests/e2e/national-go-live-command-center.spec.ts').read_text(encoding='utf-8')
          assert 'fails closed when one readiness source is unavailable' in spec
          PY
      - name: Commit resilience hardening
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/components/NationalGoLiveCommandCenter.tsx frontend/tests/e2e/national-go-live-command-center.spec.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/NationalGoLiveCommandCenter.tsx frontend/tests/e2e/national-go-live-command-center.spec.ts
          git commit -m 'fix: fail closed on partial national readiness outage'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
