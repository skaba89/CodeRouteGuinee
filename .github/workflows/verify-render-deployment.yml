name: Verify Render Deployment

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Backend Render URL'
        required: true
        default: 'https://coderouteguinee-backend.onrender.com'
      expected_repo_slug:
        description: 'Expected Render Git repository slug'
        required: true
        default: 'skaba89/CodeRouteGuinee'

permissions:
  contents: read

concurrency:
  group: verify-render-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-deployed-sha:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for Render to serve this exact main SHA
        working-directory: backend
        shell: bash
        env:
          CODEROUTE_API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://coderouteguinee-backend.onrender.com' }}
          CODEROUTE_EXPECTED_GIT_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          CODEROUTE_EXPECTED_REPO_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_repo_slug || 'skaba89/CodeRouteGuinee' }}
        run: |
          set +e
          max_rounds=12
          for round in $(seq 1 "$max_rounds"); do
            echo "Render verification round ${round}/${max_rounds} for ${CODEROUTE_EXPECTED_GIT_COMMIT}"
            python scripts/verify_render_deployment.py \
              --attempts 1 \
              --retry-delay 0 \
              --timeout 10 \
              --receipt ../render-deployment-receipt.json
            status=$?
            if [[ "$status" -eq 0 ]]; then
              echo "Render serves the expected SHA and is ready."
              exit 0
            fi
            if [[ "$round" -lt "$max_rounds" ]]; then
              echo "Runtime not converged yet; retrying after 30 seconds."
              sleep 30
            fi
          done
          echo "ERROR: Render did not serve a ready runtime for the expected SHA within the bounded verification window." >&2
          exit 2

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-deployment-receipt-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: render-deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
