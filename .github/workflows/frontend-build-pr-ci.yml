name: Frontend Build and Edge Bridge CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/app/routers/health.py'
      - 'backend/scripts/verify_render_deployment.py'
      - 'backend/tests/test_health.py'
      - 'backend/tests/test_render_deployment_fingerprint.py'
      - 'render.yaml'
      - '.github/workflows/frontend-build-pr-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/app/routers/health.py'
      - 'backend/scripts/verify_render_deployment.py'
      - 'backend/tests/test_health.py'
      - 'backend/tests/test_render_deployment_fingerprint.py'
      - 'render.yaml'
      - '.github/workflows/frontend-build-pr-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security audit — high/critical gate
        run: npm run audit:security
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  edge-bridge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Edge and available national E2E
        env:
          CI: 'true'
          VITE_API_BASE_URL: http://localhost:8000
        shell: bash
        run: |
          specs=(tests/e2e/edge-exam-bridge.spec.ts)
          for candidate in \
            tests/e2e/national-soc-security.spec.ts \
            tests/e2e/national-governance.spec.ts \
            tests/e2e/national-homologation-evidence.spec.ts; do
            if [[ -f "$candidate" ]]; then
              specs+=("$candidate")
            fi
          done
          if grep -q 'Promise.allSettled' src/components/NationalGoLiveCommandCenter.tsx 2>/dev/null \
             && grep -q 'fails closed when one readiness source is unavailable' tests/e2e/national-go-live-command-center.spec.ts 2>/dev/null; then
            specs+=(tests/e2e/national-go-live-command-center.spec.ts)
          fi
          printf 'Running critical frontend E2E:\n - %s\n' "${specs[@]}"
          npx playwright test "${specs[@]}" --project=chromium --timeout=30000 --retries=1

  render-fingerprint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt
      - name: Compile deployment identity modules when present
        working-directory: backend
        shell: bash
        run: |
          python -m compileall -q app/routers/health.py
          if [[ -f scripts/verify_render_deployment.py ]]; then
            python -m compileall -q scripts/verify_render_deployment.py
          fi
      - name: Run health and optional Render fingerprint tests
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite+pysqlite:///:memory:
          AUTO_CREATE_TABLES: 'true'
          ENVIRONMENT: test
          SOC_ENABLED: 'false'
          AUDIT_CHAIN_ENABLED: 'false'
          EDGE_LEASE_SIGNING_SECRET: coderoute-build-ci-edge-signing-secret-at-least-32-characters
          EDGE_RELEASE_SIGNING_SECRET: coderoute-build-ci-release-signing-secret-at-least-32-characters
        shell: bash
        run: |
          tests=(tests/test_health.py)
          if [[ -f tests/test_render_deployment_fingerprint.py ]]; then
            tests+=(tests/test_render_deployment_fingerprint.py)
          fi
          pytest -q --tb=short --disable-warnings "${tests[@]}"

  render-blueprint-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: pip install -q PyYAML
      - name: Validate native Render identity and checks-pass when verifier is present
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path('render.yaml').read_text(encoding='utf-8'))
          services = {service['name']: service for service in data['services']}
          backend = services['coderoute-backend']
          backup = services['coderoute-offsite-backup']
          frontend = services['coderoute-frontend']
          assert backend['healthCheckPath'] == '/health/readiness'
          assert backend['numInstances'] == 2

          env = {item['key']: item for item in backend.get('envVars', []) if 'key' in item}
          for native in ('RENDER_GIT_COMMIT', 'RENDER_GIT_BRANCH', 'RENDER_GIT_REPO_SLUG'):
              assert native not in env, f'{native} must be supplied natively by Render'

          health = Path('backend/app/routers/health.py').read_text(encoding='utf-8')
          for marker in ('RENDER_GIT_COMMIT', 'git_commit', 'git_repo_slug'):
              assert marker in health, marker

          verifier_path = Path('backend/scripts/verify_render_deployment.py')
          if not verifier_path.exists():
              print('Render verifier not delivered yet; active CI gate installed.')
              raise SystemExit(0)

          for service in (backend, backup, frontend):
              assert service.get('autoDeployTrigger') == 'checksPass', service['name']
          verifier = verifier_path.read_text(encoding='utf-8')
          for marker in ('DEPLOYED_SHA_MATCH', 'RENDER_GIT_COMMIT_PRESENT', 'coderoute_render_deployment_receipt_v1'):
              assert marker in verifier, marker
          print('Render fingerprint + checksPass contract: OK')
          PY
