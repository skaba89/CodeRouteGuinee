name: Frontend Build and Edge Bridge CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build-pr-ci.yml'
  push:
    branches:
      - work/hotfix-edge-fetch-bridge-render
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build-pr-ci.yml'
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  edge-bridge-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Edge bridge E2E
        env:
          CI: 'true'
          VITE_API_BASE_URL: http://localhost:8000
        run: npx playwright test tests/e2e/edge-exam-bridge.spec.ts --project=chromium --timeout=30000 --retries=1
