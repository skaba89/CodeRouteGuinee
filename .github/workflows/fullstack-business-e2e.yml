name: Fullstack Business E2E

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/tests/e2e/**'
      - 'frontend/playwright.config.ts'
      - '.github/workflows/fullstack-business-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/tests/e2e/**'
      - 'frontend/playwright.config.ts'
      - '.github/workflows/fullstack-business-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullstack-business-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-fastapi-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coderoute_e2e
          POSTGRES_USER: coderoute
          POSTGRES_PASSWORD: coderoute-e2e-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U coderoute -d coderoute_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://coderoute:coderoute-e2e-password@127.0.0.1:5432/coderoute_e2e
      ALEMBIC_DATABASE_URL: postgresql+psycopg://coderoute:coderoute-e2e-password@127.0.0.1:5432/coderoute_e2e
      ENVIRONMENT: development
      AUTO_CREATE_TABLES: 'false'
      SECRET_KEY: fullstack-e2e-jwt-secret-2026-very-long-random-value
      CSRF_SECRET: fullstack-e2e-csrf-secret-2026-different-random-value
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      MOBILE_MONEY_MODE: sandbox
      SOC_ENABLED: 'false'
      AUDIT_CHAIN_ENABLED: 'false'
      ENABLE_API_DOCS: 'true'
      FULLSTACK_E2E_EMAIL: e2e.candidate@coderoute.test
      FULLSTACK_E2E_PASSWORD: FullstackTest123!
      FULLSTACK_E2E_CENTER: E2E Centre Kaloum

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt

      - name: Apply real PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Assert migrated readiness against PostgreSQL
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          import os
          engine = create_engine(os.environ['DATABASE_URL'])
          tables = set(inspect(engine).get_table_names())
          required = {'users','candidates','centers','exam_sessions','bookings','payments','audit_logs','alembic_version'}
          missing = sorted(required - tables)
          if missing:
              raise SystemExit(f'Missing migrated tables: {missing}')
          print('PostgreSQL schema ready:', len(tables), 'tables')
          PY

      - name: Run critical business invariants on PostgreSQL
        working-directory: backend
        env:
          PYTHONPATH: .
        run: >-
          pytest -q --tb=short --disable-warnings
          tests/test_auth_security_invariants.py
          tests/test_payment_security_invariants.py
          tests/test_payment_quote.py
          tests/test_multicenter_business_invariants.py
          tests/test_registration_booking_compatibility.py
          tests/test_official_exam_runtime_e2e.py
          tests/test_payment_provider_dispatcher.py
          tests/test_candidate_creation_concurrency.py
          tests/test_candidate_self_service_authorization.py
          tests/test_candidate_exam_eligibility.py
          tests/test_exam_start_eligibility_guard.py

      - name: Reset PostgreSQL database after invariant tests
        working-directory: backend
        run: |
          python - <<'PY'
          import psycopg

          conn = psycopg.connect(
              "dbname=postgres user=coderoute password=coderoute-e2e-password host=127.0.0.1 port=5432",
              autocommit=True,
          )
          with conn.cursor() as cur:
              cur.execute(
                  "SELECT pg_terminate_backend(pid) FROM pg_stat_activity "
                  "WHERE datname = %s AND pid <> pg_backend_pid()",
                  ("coderoute_e2e",),
              )
              cur.execute("DROP DATABASE IF EXISTS coderoute_e2e")
              cur.execute("CREATE DATABASE coderoute_e2e OWNER coderoute")
          conn.close()
          print("Fresh PostgreSQL database recreated")
          PY

      - name: Re-apply migrations and seed browser journey
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          alembic upgrade head
          python scripts/seed_fullstack_e2e.py

      - name: Start real FastAPI backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/coderoute-api.log 2>&1 &
          echo $! >/tmp/coderoute-api.pid

      - name: Wait for liveness and PostgreSQL readiness
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/health/live >/tmp/live.json && \
               curl -fsS http://127.0.0.1:8000/health/readiness >/tmp/readiness.json; then
              cat /tmp/readiness.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/coderoute-api.log || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend security, typecheck and production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm run audit:security
          npm run typecheck
          npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend API error contract and real browser candidate journey
        working-directory: frontend
        env:
          CI: 'true'
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: >-
          npx playwright test
          tests/e2e/api-error-contract.spec.ts
          tests/e2e/fullstack-critical-journey.spec.ts
          --project=chromium --timeout=45000 --retries=1

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-backend-log
          path: /tmp/coderoute-api.log
          if-no-files-found: ignore
