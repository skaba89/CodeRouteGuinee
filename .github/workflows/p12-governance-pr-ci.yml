name: P12 Governance PR CI

on:
  pull_request:
    paths:
      - 'backend/app/national_governance.py'
      - 'backend/app/national_governance_guard.py'
      - 'backend/app/routers/national_governance.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_national_governance.py'
      - 'backend/tests/test_national_homologation.py'
      - 'frontend/src/nationalGovernanceClient.ts'
      - 'frontend/src/components/NationalGovernancePanel.tsx'
      - 'frontend/src/components/NationalDashboard.tsx'
      - 'frontend/tests/e2e/national-governance.spec.ts'
      - 'docs/P12_NATIONAL_GOVERNANCE_HOMOLOGATION.md'
      - '.github/workflows/p12-governance-pr-ci.yml'
  workflow_dispatch:

jobs:
  governance-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt
      - name: Compile P12 modules
        working-directory: backend
        run: python -m compileall -q app/national_governance.py app/national_governance_guard.py app/routers/national_governance.py
      - name: Run P12 governance tests
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite+pysqlite:///:memory:
          AUTO_CREATE_TABLES: 'true'
          ENVIRONMENT: test
          SOC_ENABLED: 'false'
          AUDIT_CHAIN_ENABLED: 'false'
        run: |
          pytest -q --tb=short --disable-warnings \
            tests/test_national_governance.py \
            tests/test_national_homologation.py

  governance-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run P12 DNTT E2E
        run: npx playwright test tests/e2e/national-governance.spec.ts --project=chromium
