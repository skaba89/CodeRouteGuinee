name: Apply Exam Recovery Hardening Patch

on:
  push:
    branches:
      - agent/exam-runtime-recovery-idempotence-p0
    paths:
      - .github/workflows/apply-exam-recovery-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exam-runtime-recovery-idempotence-p0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact runtime patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          exams_path = Path('backend/app/routers/exams.py')
          exams = exams_path.read_text(encoding='utf-8')

          exams = replace_once(
              exams,
              'from app.exam_engine import (\n',
              'from app.exam_attempt_locking import find_recoverable_attempt, lock_exam_attempt\nfrom app.exam_engine import (\n',
              'exams import locking',
          )

          exams = replace_once(
              exams,
              '    booking = db.scalar(select(Booking).where(Booking.reference == payload.booking_reference))\n',
              '    booking = db.scalar(\n        select(Booking)\n        .where(Booking.reference == payload.booking_reference)\n        .with_for_update()\n    )\n',
              'booking row lock',
          )

          exams = replace_once(
              exams,
              '''    attempt = _create_exam_attempt(db, booking.candidate_id, booking.session_id)\n    _register_exam_start_device(db, attempt, session, payload.device_key, payload.device_label)\n    db.commit()\n    db.refresh(attempt)\n    return attempt\n''',
              '''    existing_attempt = find_recoverable_attempt(db, booking.candidate_id, booking.session_id)\n    if existing_attempt is not None:\n        _assert_attempt_access(db, current_user, existing_attempt)\n        _register_exam_start_device(\n            db, existing_attempt, session, payload.device_key, payload.device_label\n        )\n        db.add(\n            AuditLog(\n                actor_id=current_user.id,\n                action="exam.attempt_resumed",\n                entity="exam_attempt",\n                entity_id=existing_attempt.id,\n                details={\n                    "booking_reference": booking.reference,\n                    "candidate_id": booking.candidate_id,\n                    "session_id": booking.session_id,\n                    "attempt_status": existing_attempt.status,\n                    "recovery_mode": "booking_retry_or_device_replacement",\n                },\n            )\n        )\n        db.commit()\n        db.refresh(existing_attempt)\n        return existing_attempt\n\n    attempt = _create_exam_attempt(db, booking.candidate_id, booking.session_id)\n    _register_exam_start_device(db, attempt, session, payload.device_key, payload.device_label)\n    db.commit()\n    db.refresh(attempt)\n    return attempt\n''',
              'resume existing attempt',
          )

          exams = replace_once(
              exams,
              '''def submit_exam(\n    attempt_id: str,\n    payload: ExamSubmitRequest,\n    db: Session = Depends(get_db),\n    current_user: User = Depends(require_roles("candidate", "center", "admin", "super_admin")),\n) -> ExamAttempt:\n    attempt = db.get(ExamAttempt, attempt_id)\n''',
              '''def submit_exam(\n    attempt_id: str,\n    payload: ExamSubmitRequest,\n    db: Session = Depends(get_db),\n    current_user: User = Depends(require_roles("candidate", "center", "admin", "super_admin")),\n) -> ExamAttempt:\n    attempt = lock_exam_attempt(db, attempt_id)\n''',
              'submit row lock',
          )

          exams = replace_once(
              exams,
              '''    if attempt.status == "submitted":\n        _write_exam_guard_log(db, attempt, "exam.replay_submission", "already_submitted", now)\n        db.commit()\n        raise HTTPException(status_code=status.HTTP_409_CONFLICT, detail="Exam attempt already submitted")\n''',
              '''    if attempt.status == "submitted":\n        _write_exam_guard_log(db, attempt, "exam.replay_submission", "already_submitted", now)\n        db.commit()\n        db.refresh(attempt)\n        return attempt\n''',
              'idempotent replay submit',
          )

          exams_path.write_text(exams, encoding='utf-8')

          runtime_path = Path('backend/app/routers/exam_runtime.py')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = replace_once(
              runtime,
              'from app.exam_engine import EXAM_DURATION_MINUTES, build_score_summary, score_answers\n',
              'from app.exam_attempt_locking import lock_exam_attempt\nfrom app.exam_engine import EXAM_DURATION_MINUTES, build_score_summary, score_answers\n',
              'runtime import locking',
          )
          runtime = replace_once(
              runtime,
              '''def save_exam_answers(\n    attempt_id: str,\n    payload: ExamSubmitRequest,\n    db: Session = Depends(get_db),\n    current_user: User = Depends(require_roles("candidate", "center", "admin", "super_admin")),\n) -> dict:\n    """Sauvegarde la copie serveur des réponses d'une tentative active.\n\n    Seules les questions sélectionnées dans la trace officielle sont conservées.\n    Une réponse reçue après l'échéance est refusée et ne peut donc pas modifier\n    la copie qui servira à la finalisation automatique.\n    """\n    attempt = db.get(ExamAttempt, attempt_id)\n''',
              '''def save_exam_answers(\n    attempt_id: str,\n    payload: ExamSubmitRequest,\n    db: Session = Depends(get_db),\n    current_user: User = Depends(require_roles("candidate", "center", "admin", "super_admin")),\n) -> dict:\n    """Sauvegarde la copie serveur des réponses d'une tentative active.\n\n    Seules les questions sélectionnées dans la trace officielle sont conservées.\n    Une réponse reçue après l'échéance est refusée et ne peut donc pas modifier\n    la copie qui servira à la finalisation automatique. Le verrou de ligne évite\n    aussi qu'une sauvegarde et une soumission finale modifient la tentative en\n    parallèle.\n    """\n    attempt = lock_exam_attempt(db, attempt_id)\n''',
              'autosave row lock',
          )
          runtime = replace_once(
              runtime,
              '''def timeout_submit_exam(\n    attempt_id: str,\n    db: Session = Depends(get_db),\n    current_user: User = Depends(require_roles("candidate", "center", "admin", "super_admin")),\n) -> ExamAttempt:\n    """Finalise l'épreuve à la limite de temps avec la dernière copie serveur.\n\n    Aucun payload de réponses n'est accepté : le serveur score uniquement ce qui\n    a été autosauvegardé avant l'échéance. Une petite fenêtre de 2 secondes avant\n    la deadline permet au navigateur synchronisé de déclencher proprement la\n    finalisation malgré la latence réseau, sans offrir de temps de réponse en plus.\n    """\n    attempt = db.get(ExamAttempt, attempt_id)\n''',
              '''def timeout_submit_exam(\n    attempt_id: str,\n    db: Session = Depends(get_db),\n    current_user: User = Depends(require_roles("candidate", "center", "admin", "super_admin")),\n) -> ExamAttempt:\n    """Finalise l'épreuve à la limite de temps avec la dernière copie serveur.\n\n    Aucun payload de réponses n'est accepté : le serveur score uniquement ce qui\n    a été autosauvegardé avant l'échéance. Une petite fenêtre de 2 secondes avant\n    la deadline permet au navigateur synchronisé de déclencher proprement la\n    finalisation malgré la latence réseau, sans offrir de temps de réponse en plus.\n    Le verrou de ligne rend cette finalisation idempotente face à une soumission\n    manuelle concurrente.\n    """\n    attempt = lock_exam_attempt(db, attempt_id)\n''',
              'timeout row lock',
          )
          runtime_path.write_text(runtime, encoding='utf-8')

          exam_path = Path('frontend/src/pages/exam.tsx')
          exam = exam_path.read_text(encoding='utf-8')

          exam = replace_once(
              exam,
              '''  getExamLiveStatus,\n  getExamQuestions,\n  getExamResults,\n  postPrivateJson,\n''',
              '''  getExamLiveStatus,\n  getExamQuestions,\n  getExamResults,\n  getPrivateJson,\n  postPrivateJson,\n''',
              'frontend getPrivateJson import',
          )

          exam = replace_once(
              exam,
              '''function toApiAnswers(answers: Record<number, string>, questions: QData[]): Record<string, string> {\n  const payload: Record<string, string> = {};\n  Object.entries(answers).forEach(([index, answer]) => {\n    const question = questions[Number(index)];\n    if (question) payload[question.id] = answer;\n  });\n  return payload;\n}\n\n''',
              '''function toApiAnswers(answers: Record<number, string>, questions: QData[]): Record<string, string> {\n  const payload: Record<string, string> = {};\n  Object.entries(answers).forEach(([index, answer]) => {\n    const question = questions[Number(index)];\n    if (question) payload[question.id] = answer;\n  });\n  return payload;\n}\n\nfunction fromApiAnswers(apiAnswers: Record<string, string>, questions: QData[]): Record<number, string> {\n  const indexById = new Map(questions.map((question, index) => [question.id, index]));\n  const restored: Record<number, string> = {};\n  Object.entries(apiAnswers).forEach(([questionId, answer]) => {\n    const index = indexById.get(questionId);\n    if (index !== undefined && typeof answer === 'string') restored[index] = answer;\n  });\n  return restored;\n}\n\nasync function getServerAnswerSnapshot(attemptId: string): Promise<Record<string, string>> {\n  try {\n    const payload = await getPrivateJson<{ answers: Record<string, string> }>(\n      `/api/v1/exams/${encodeURIComponent(attemptId)}/answers`,\n    );\n    return payload.answers ?? {};\n  } catch {\n    return {};\n  }\n}\n\n''',
              'frontend answer restoration helpers',
          )

          exam = replace_once(
              exam,
              '''  const [saveState, setSaveState] = useState<SaveState>('idle');\n  const [timerSyncedAt, setTimerSyncedAt] = useState<Date | null>(null);\n  const timeoutSubmitFired = useRef(false);\n''',
              '''  const [saveState, setSaveState] = useState<SaveState>('idle');\n  const [timerSyncedAt, setTimerSyncedAt] = useState<Date | null>(null);\n  const [submitting, setSubmitting] = useState(false);\n  const timeoutSubmitFired = useRef(false);\n  const submissionInFlight = useRef(false);\n  const autosaveQueue = useRef<Promise<void>>(Promise.resolve());\n  const latestAutosaveSnapshot = useRef<Record<number, string>>({});\n''',
              'frontend concurrency refs',
          )

          exam = replace_once(
              exam,
              '''        const response = await getExamQuestions(storedAttemptId, locale);\n        if (cancelled) return;\n        setAttemptId(storedAttemptId);\n        setLiveQuestions(response.questions);\n        setAnswers(readStoredAnswers(storedAttemptId));\n        setRemainingSeconds(status.remaining_seconds);\n''',
              '''        const [response, serverSnapshot] = await Promise.all([\n          getExamQuestions(storedAttemptId, locale),\n          getServerAnswerSnapshot(storedAttemptId),\n        ]);\n        if (cancelled) return;\n        setAttemptId(storedAttemptId);\n        setLiveQuestions(response.questions);\n        const questionView: QData[] = response.questions.map((question, index) => ({\n          id: question.id, text: question.text, options: question.options, number: index + 1,\n          category: question.category, media: question.media_url ?? undefined,\n          mediaType: question.media_type ?? undefined, mediaAlt: question.media_alt ?? undefined,\n          audioUrl: question.audio_url ?? undefined,\n        }));\n        const restoredAnswers = {\n          ...fromApiAnswers(serverSnapshot, questionView),\n          ...readStoredAnswers(storedAttemptId),\n        };\n        setAnswers(restoredAnswers);\n        persistStoredAnswers(storedAttemptId, restoredAnswers);\n        latestAutosaveSnapshot.current = restoredAnswers;\n        autosaveQueue.current = Promise.resolve();\n        setRemainingSeconds(status.remaining_seconds);\n''',
              'automatic recovery from server',
          )

          exam = replace_once(
              exam,
              '''  async function autosaveOfficialAnswers(nextAnswers: Record<number, string>) {\n    if (!attemptId) return;\n    persistStoredAnswers(attemptId, nextAnswers);\n    setSaveState('saving');\n    try {\n      await postPrivateJson(`/api/v1/exams/${encodeURIComponent(attemptId)}/answers`, {\n        answers: toApiAnswers(nextAnswers, questions),\n      });\n      setSaveState('saved');\n    } catch {\n      // La session navigateur conserve la saisie ; la prochaine réponse retentera\n      // une sauvegarde serveur. Le résultat officiel n'est jamais calculé ici.\n      setSaveState('offline');\n    }\n  }\n''',
              '''  function autosaveOfficialAnswers(nextAnswers: Record<number, string>): Promise<void> {\n    if (!attemptId) return Promise.resolve();\n    const id = attemptId;\n    const snapshot = nextAnswers;\n    const apiAnswers = toApiAnswers(snapshot, questions);\n    persistStoredAnswers(id, snapshot);\n    latestAutosaveSnapshot.current = snapshot;\n    setSaveState('saving');\n\n    const saveSnapshot = async () => {\n      try {\n        await postPrivateJson(`/api/v1/exams/${encodeURIComponent(id)}/answers`, { answers: apiAnswers });\n        if (latestAutosaveSnapshot.current === snapshot) setSaveState('saved');\n      } catch {\n        // Une copie locale plus récente reste prioritaire. La file FIFO évite\n        // qu'un vieux snapshot arrivé tardivement écrase une réponse récente.\n        if (latestAutosaveSnapshot.current === snapshot) setSaveState('offline');\n      }\n    };\n\n    autosaveQueue.current = autosaveQueue.current.catch(() => undefined).then(saveSnapshot);\n    return autosaveQueue.current;\n  }\n''',
              'serialized frontend autosave',
          )

          exam = replace_once(
              exam,
              '''      const [questionsResponse, status] = await Promise.all([\n        getExamQuestions(attempt.id, locale),\n        getExamLiveStatus(attempt.id),\n      ]);\n''',
              '''      const [questionsResponse, status, serverSnapshot] = await Promise.all([\n        getExamQuestions(attempt.id, locale),\n        getExamLiveStatus(attempt.id),\n        getServerAnswerSnapshot(attempt.id),\n      ]);\n''',
              'booking start server snapshot',
          )

          exam = replace_once(
              exam,
              '''      setAttemptId(attempt.id);\n      setLiveQuestions(questionsResponse.questions);\n      setAnswers({});\n      persistStoredAnswers(attempt.id, {});\n      setIdx(0);\n''',
              '''      setAttemptId(attempt.id);\n      setLiveQuestions(questionsResponse.questions);\n      const questionView: QData[] = questionsResponse.questions.map((question, index) => ({\n        id: question.id, text: question.text, options: question.options, number: index + 1,\n        category: question.category, media: question.media_url ?? undefined,\n        mediaType: question.media_type ?? undefined, mediaAlt: question.media_alt ?? undefined,\n        audioUrl: question.audio_url ?? undefined,\n      }));\n      const restoredAnswers = fromApiAnswers(serverSnapshot, questionView);\n      setAnswers(restoredAnswers);\n      persistStoredAnswers(attempt.id, restoredAnswers);\n      latestAutosaveSnapshot.current = restoredAnswers;\n      autosaveQueue.current = Promise.resolve();\n      setIdx(0);\n''',
              'booking start restore answers',
          )

          old_submit = '''  async function submitExam() {\n    setSubmissionErr('');\n\n    if (attemptId) {\n      try {\n        try {\n          await submitExamAttempt(attemptId, toApiAnswers(answers, questions));\n        } catch {\n          // En cas de timeout réseau ou de soumission déjà finalisée, on tente\n          // toujours de relire la vérité persistée côté serveur.\n        }\n        await loadServerResult(attemptId);\n      } catch (err: unknown) {\n        setSubmissionErr(errMsg(err, "Impossible d'enregistrer ou de récupérer le résultat officiel."));\n        timeoutSubmitFired.current = false;\n      }\n      return;\n    }\n\n    const score = questions.filter((_, index) => answers[index] === questions[index].correct_answer).length;\n    setResult({\n      score,\n      threshold: 35,\n      passed: score >= 35,\n      questions: questions.map((question, index) => ({\n        question_id: question.id,\n        question_text: question.text,\n        candidate_answer: answers[index] ?? '—',\n        correct_answer: question.correct_answer,\n        is_correct: answers[index] === question.correct_answer,\n        category: question.category,\n        options: question.options,\n        explanation: question.expl,\n      })),\n    });\n    setPhase('done');\n  }\n'''
          new_submit = '''  async function submitExam() {\n    if (submissionInFlight.current) return;\n    submissionInFlight.current = true;\n    setSubmitting(true);\n    setSubmissionErr('');\n\n    try {\n      if (attemptId) {\n        try {\n          // Attendre la file d'autosauvegarde évite que la soumission finale\n          // dépasse encore un snapshot local en transit.\n          await autosaveQueue.current.catch(() => undefined);\n          try {\n            await submitExamAttempt(attemptId, toApiAnswers(answers, questions));\n          } catch {\n            // Un retry réseau ou une soumission déjà finalisée est idempotent :\n            // on relit toujours le résultat persistant comme source de vérité.\n          }\n          await loadServerResult(attemptId);\n        } catch (err: unknown) {\n          setSubmissionErr(errMsg(err, "Impossible d'enregistrer ou de récupérer le résultat officiel."));\n          timeoutSubmitFired.current = false;\n        }\n        return;\n      }\n\n      const score = questions.filter((_, index) => answers[index] === questions[index].correct_answer).length;\n      setResult({\n        score,\n        threshold: 35,\n        passed: score >= 35,\n        questions: questions.map((question, index) => ({\n          question_id: question.id,\n          question_text: question.text,\n          candidate_answer: answers[index] ?? '—',\n          correct_answer: question.correct_answer,\n          is_correct: answers[index] === question.correct_answer,\n          category: question.category,\n          options: question.options,\n          explanation: question.expl,\n        })),\n      });\n      setPhase('done');\n    } finally {\n      submissionInFlight.current = false;\n      setSubmitting(false);\n    }\n  }\n'''
          exam = replace_once(exam, old_submit, new_submit, 'frontend idempotent submit')

          exam = replace_once(
              exam,
              '''    setSaveState('idle');\n    setTimerSyncedAt(null);\n    timeoutSubmitFired.current = false;\n  }\n''',
              '''    setSaveState('idle');\n    setTimerSyncedAt(null);\n    setSubmitting(false);\n    submissionInFlight.current = false;\n    autosaveQueue.current = Promise.resolve();\n    latestAutosaveSnapshot.current = {};\n    timeoutSubmitFired.current = false;\n  }\n''',
              'reset concurrency state',
          )

          exam = replace_once(
              exam,
              ''': <button className="btn-success btn-sm" onClick={() => { void submitExam(); }} style={{ display: 'flex', alignItems: 'center', gap: 5 }}><IconCheck size={15}/> Soumettre</button>}\n''',
              ''': <button className="btn-success btn-sm" disabled={submitting} onClick={() => { void submitExam(); }} style={{ display: 'flex', alignItems: 'center', gap: 5 }}><IconCheck size={15}/> {submitting ? 'Soumission…' : 'Soumettre'}</button>}\n''',
              'last question submit button',
          )

          exam = replace_once(
              exam,
              '''            <button className="btn-success btn-sm" onClick={() => {\n              if (answered < questions.length) {\n''',
              '''            <button className="btn-success btn-sm" disabled={submitting} onClick={() => {\n              if (answered < questions.length) {\n''',
              'grid submit disabled',
          )

          exam = replace_once(
              exam,
              '''              <IconCheck size={14}/>{answered < questions.length ? `Vérifier (${questions.length - answered} restantes)` : "Soumettre l'examen"}\n''',
              '''              <IconCheck size={14}/>{submitting ? 'Soumission…' : answered < questions.length ? `Vérifier (${questions.length - answered} restantes)` : "Soumettre l'examen"}\n''',
              'grid submit label',
          )

          exam_path.write_text(exam, encoding='utf-8')
          PY

      - name: Verify syntax before commit
        run: |
          python -m compileall -q backend/app
          cd frontend
          npm ci
          npm run typecheck
          npm run build

      - name: Remove one-time patch workflow and commit
        run: |
          git rm .github/workflows/apply-exam-recovery-patch.yml
          git config user.name "CodeRoute Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/routers/exams.py backend/app/routers/exam_runtime.py frontend/src/pages/exam.tsx
          git commit -m "fix: make exam recovery and submission idempotent"
          git push origin HEAD:agent/exam-runtime-recovery-idempotence-p0
