name: Validate PWA Cache Security

on:
  push:
    branches:
      - agent/pwa-cache-security-p1
    paths:
      - .github/workflows/validate-pwa-cache.yml

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pwa-cache-security-p1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, typecheck and build PWA
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Verify generated service worker does not cache sensitive API routes
        working-directory: frontend
        run: |
          test -f dist/sw.js
          if grep -q "training-content-v2" dist/sw.js; then
            echo "Training cache generated"
          else
            echo "training-content-v2 missing from service worker" >&2
            exit 1
          fi
          if grep -q "training-cache" dist/sw.js; then
            echo "Legacy training-cache still present" >&2
            exit 1
          fi
      - name: Publish observable success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=pwa-cache-security/build \
            -f description='PWA typecheck, build and generated SW validation passed'
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/validate-pwa-cache.yml
          git config user.name "CodeRoute Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: remove PWA validation workflow"
          git push origin HEAD:agent/pwa-cache-security-p1
