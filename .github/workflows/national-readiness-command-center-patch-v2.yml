name: Extend National Readiness for Command Center v2

on:
  pull_request:
    paths:
      - '.github/workflows/national-readiness-command-center-patch-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Verify feature integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          dashboard = Path('frontend/src/components/NationalDashboard.tsx').read_text(encoding='utf-8')
          assert dashboard.count("import { NationalGoLiveCommandCenter } from './NationalGoLiveCommandCenter';") == 1
          assert dashboard.count('<NationalGoLiveCommandCenter />') == 1
          assert '<NationalGoLiveCommandCenter />\n      <NationalGovernancePanel />' in dashboard
          for value in (
              'frontend/src/components/NationalGoLiveCommandCenter.tsx',
              'frontend/src/reliabilityClient.ts',
              'frontend/tests/e2e/national-go-live-command-center.spec.ts',
          ):
              assert Path(value).exists(), value
          print('Command Center integration confirmed.')
          PY
      - name: Extend permanent national readiness suite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/national-code-readiness.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          slash = chr(92)

          def insert_after_exact(anchor_text: str, additions: list[str]) -> None:
              nonlocal_lines = lines
              normalized = [line.rstrip('\r\n') for line in nonlocal_lines]
              missing = [item for item in additions if item.rstrip('\r\n') not in normalized]
              if not missing:
                  return
              matches = [index for index, line in enumerate(normalized) if line == anchor_text]
              if len(matches) != 1:
                  raise SystemExit(f'anchor {anchor_text!r}: expected 1, found {len(matches)}')
              index = matches[0] + 1
              nonlocal_lines[index:index] = missing

          insert_after_exact(
              '          tests/e2e/national-governance.spec.ts',
              [
                  '          tests/e2e/national-homologation-evidence.spec.ts\n',
                  '          tests/e2e/national-go-live-command-center.spec.ts\n',
              ],
          )
          insert_after_exact(
              '            tests/test_soc_runtime_security.py',
              [
                  f'            tests/test_soc_go_live_readiness.py {slash}\n',
                  f'            tests/test_go_live_evidence_pack.py {slash}\n',
                  f'            tests/test_go_live_evidence_pitr.py {slash}\n',
                  '            tests/test_national_readiness_pitr.py\n',
              ],
          )
          insert_after_exact(
              '            tests/test_national_homologation.py',
              ['            tests/test_homologation_evidence_integrity.py\n'],
          )

          path.write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Verify permanent gate
        shell: bash
        run: |
          git diff -- .github/workflows/national-code-readiness.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/national-code-readiness.yml').read_text(encoding='utf-8')
          markers = (
              'tests/e2e/national-go-live-command-center.spec.ts',
              'tests/e2e/national-homologation-evidence.spec.ts',
              'tests/test_soc_go_live_readiness.py',
              'tests/test_go_live_evidence_pack.py',
              'tests/test_go_live_evidence_pitr.py',
              'tests/test_national_readiness_pitr.py',
              'tests/test_homologation_evidence_integrity.py',
          )
          for marker in markers:
              assert text.count(marker) == 1, (marker, text.count(marker))
          print('National readiness suite includes all go-live regressions.')
          PY
      - name: Commit permanent gate extension
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/national-code-readiness.yml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/national-code-readiness.yml
          git commit -m 'ci: include national go-live gates in readiness suite'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
