name: P11 Evidence Pack Source Patch

on:
  pull_request:
    paths:
      - '.github/workflows/p11-evidence-pack-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Insert fail-closed P11 go-live evidence check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/scripts/collect_go_live_evidence.py')
          text = path.read_text(encoding='utf-8')
          marker = '"P11_SECURITY_GO_LIVE"'
          anchor = '''        add_check(
              "P11_NO_CRITICAL_SIGNAL",
              security.get("status") == "ok",
              f"security.status={security.get('status') or 'unknown'}",
          )'''
          anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in anchor.splitlines())
          insertion = '''        security_go_live = security.get("go_live") if isinstance(security.get("go_live"), dict) else {}
          security_go_live_ready = security_go_live.get("ready") is True
          security_go_live_blockers = security_go_live.get("blockers") if isinstance(security_go_live.get("blockers"), list) else []
          if security_go_live_ready:
              security_go_live_detail = "gate sécurité P11 prêt"
          elif security_go_live:
              values = [str(item)[:100] for item in security_go_live_blockers[:10]]
              security_go_live_detail = "gate P11 bloqué" + ((": " + " | ".join(values)) if values else "")
          else:
              security_go_live_detail = "gate P11 absent du statut sécurité"
          add_check("P11_SECURITY_GO_LIVE", security_go_live_ready, security_go_live_detail)'''
          insertion = '\n'.join(line[10:] if line.startswith('          ') else line for line in insertion.splitlines())
          if marker in text:
              print('P11 evidence-pack gate already present')
          elif text.count(anchor) != 1:
              raise SystemExit(f'expected one P11_NO_CRITICAL_SIGNAL block, found {text.count(anchor)}')
          else:
              path.write_text(text.replace(anchor, anchor + '\n' + insertion, 1), encoding='utf-8')
              print('P11 evidence-pack gate inserted')
          PY
      - name: Verify exact scope
        shell: bash
        run: |
          git diff -- backend/scripts/collect_go_live_evidence.py
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/scripts/collect_go_live_evidence.py').read_text(encoding='utf-8')
          assert text.count('"P11_SECURITY_GO_LIVE"') == 1
          assert 'gate P11 absent du statut sécurité' in text
          assert 'security_go_live.get("ready") is True' in text
          PY
      - name: Commit collector patch
        shell: bash
        run: |
          if git diff --quiet -- backend/scripts/collect_go_live_evidence.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/scripts/collect_go_live_evidence.py
          git commit -m 'ops: require P11 security go-live gate in evidence pack'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
