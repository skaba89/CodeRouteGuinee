name: Agent CI Probe

on:
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow execution
        run: |
          echo "Agent branch workflow trigger is operational"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
