name: Agent Branch CI

on:
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:

jobs:
  backend-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt
      - name: Compile backend and operational scripts
        working-directory: backend
        run: python -m compileall -q app scripts
      - name: Validate operational shell scripts
        working-directory: backend
        run: bash -n entrypoint.sh scripts/*.sh
      - name: Run targeted regression tests
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite+pysqlite:///:memory:
          AUTO_CREATE_TABLES: 'true'
          ENVIRONMENT: test
          SOC_ENABLED: 'false'
          AUDIT_CHAIN_ENABLED: 'false'
          EDGE_LEASE_SIGNING_SECRET: coderoute-agent-ci-edge-signing-secret-at-least-32-characters
          EDGE_RELEASE_SIGNING_SECRET: coderoute-agent-ci-release-signing-secret-at-least-32-characters
        run: |
          candidates=(
            tests/test_exam_attempt_access.py
            tests/test_exam_runtime_recovery.py
            tests/test_center_edge.py
            tests/test_center_edge_offline.py
            tests/test_center_edge_fleet.py
            tests/test_center_edge_release.py
            tests/test_center_edge_supply_chain.py
            tests/test_edge_install_authorization.py
            tests/test_distributed_ha.py
            tests/test_middleware_ha.py
            tests/test_ha_config.py
            tests/test_pra_scripts.py
            tests/test_reliability_config.py
            tests/test_reliability_api.py
            tests/test_reliability_security.py
            tests/test_metrics_endpoint.py
            tests/test_secure_backup_bundle.py
            tests/test_offsite_backup.py
            tests/test_ha_failover_probe.py
            tests/test_soc_go_live_readiness.py
            tests/test_go_live_evidence_pack.py
            tests/test_go_live_evidence_pitr.py
            tests/test_render_deployment_fingerprint.py
            tests/test_national_readiness_pitr.py
            tests/test_homologation_evidence_integrity.py
            tests/test_media_policy.py
            tests/test_question_media_schema_compat.py
            tests/test_e2e_exam_question_trace.py
            tests/test_e2e_exam_certificate.py
            tests/test_e2e_candidate_center_multimedia_exam.py
            tests/test_question_governance.py
            tests/test_health.py
          )
          selected=()
          for file in "${candidates[@]}"; do
            if [ -f "$file" ]; then
              selected+=("$file")
            fi
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No targeted backend tests found on this branch."
            exit 0
          fi
          printf 'Running targeted backend tests:\n - %s\n' "${selected[@]}"
          pytest -q --tb=short --disable-warnings "${selected[@]}"

  edge-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Center Edge Agent dependencies
        run: pip install -q -r edge_agent/requirements.txt
      - name: Compile Center Edge Agent and privileged scripts
        run: python -m compileall -q edge_agent/coderoute_edge edge_agent/scripts
      - name: Test encrypted offline agent, release chain and system updater
        env:
          PYTHONPATH: edge_agent
        run: pytest -q --tb=short --disable-warnings edge_agent/tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Reject high/critical npm vulnerabilities
        working-directory: frontend
        run: npm run audit:security
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  frontend-targeted-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run targeted Playwright regressions when present
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
          CI: 'true'
        run: |
          candidates=(
            tests/e2e/exam-runtime-resilience.spec.ts
            tests/e2e/media-policy.spec.ts
            tests/e2e/edge-exam-bridge.spec.ts
            tests/e2e/center-edge-operations.spec.ts
            tests/e2e/national-edge-fleet.spec.ts
            tests/e2e/edge-release-rollout.spec.ts
            tests/e2e/center-edge-release-local.spec.ts
            tests/e2e/edge-supply-chain.spec.ts
            tests/e2e/national-soc-security.spec.ts
            tests/e2e/national-governance.spec.ts
            tests/e2e/national-go-live-command-center.spec.ts
            tests/e2e/national-homologation-evidence.spec.ts
          )
          selected=()
          for file in "${candidates[@]}"; do
            if [ -f "$file" ]; then
              selected+=("$file")
            fi
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No targeted frontend E2E tests found on this branch."
            exit 0
          fi
          echo "Installing Chromium for targeted Playwright tests."
          printf 'Running targeted frontend tests:\n - %s\n' "${selected[@]}"
          npx playwright install --with-deps chromium
          npx playwright test "${selected[@]}" --project=chromium --timeout=30000 --retries=1

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Render Blueprint contract
        run: |
          pip install -q PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path('render.yaml').read_text(encoding='utf-8'))
          services = {service['name']: service for service in data['services']}
          for name in ('coderoute-backend', 'coderoute-offsite-backup', 'coderoute-frontend'):
              assert services[name].get('autoDeployTrigger') == 'checksPass', name
          backend = services['coderoute-backend']
          env = {item['key']: item for item in backend.get('envVars', []) if 'key' in item}
          for name in ('RENDER_GIT_COMMIT', 'RENDER_GIT_BRANCH', 'RENDER_GIT_REPO_SLUG'):
              assert name not in env, name
          verifier = Path('backend/scripts/verify_render_deployment.py').read_text(encoding='utf-8')
          for marker in ('DEPLOYED_SHA_MATCH', 'RENDER_GIT_COMMIT_PRESENT', 'coderoute_render_deployment_receipt_v1'):
              assert marker in verifier, marker
          print('Render deployment contract: OK')
          PY

  publish-agent-statuses:
    if: always()
    runs-on: ubuntu-latest
    needs: [backend-targeted, edge-agent, frontend-build, frontend-targeted-e2e, deployment-contract]
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      BACKEND_RESULT: ${{ needs.backend-targeted.result }}
      EDGE_AGENT_RESULT: ${{ needs.edge-agent.result }}
      FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
      FRONTEND_E2E_RESULT: ${{ needs.frontend-targeted-e2e.result }}
      DEPLOYMENT_RESULT: ${{ needs.deployment-contract.result }}
    steps:
      - name: Publish observable commit statuses
        shell: bash
        run: |
          publish_status() {
            result="$1"
            context="$2"
            description="$3"
            case "$result" in
              success) state=success ;;
              failure|cancelled) state=failure ;;
              *) state=error ;;
            esac
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" \
              -f context="$context" \
              -f description="$description ($result)"
          }

          publish_status "$BACKEND_RESULT" "agent-ci/backend-targeted" "Targeted backend + national readiness suite"
          publish_status "$EDGE_AGENT_RESULT" "agent-ci/edge-agent" "Center Edge Agent + P9 updater suite"
          publish_status "$FRONTEND_BUILD_RESULT" "agent-ci/frontend-build" "Frontend audit, typecheck and production build"
          publish_status "$FRONTEND_E2E_RESULT" "agent-ci/frontend-e2e" "Targeted national Playwright regressions"
          publish_status "$DEPLOYMENT_RESULT" "agent-ci/deployment-contract" "Render checks-pass and SHA fingerprint contract"

          if [ "$BACKEND_RESULT" = success ] && [ "$EDGE_AGENT_RESULT" = success ] && [ "$FRONTEND_BUILD_RESULT" = success ] && [ "$FRONTEND_E2E_RESULT" = success ] && [ "$DEPLOYMENT_RESULT" = success ]; then
            overall=success
          else
            overall=failure
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$overall" \
            -f context="agent-ci/overall" \
            -f description="Agent branch Render fingerprint validation"
