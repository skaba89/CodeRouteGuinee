name: P11 Security Go-Live Gate CI

on:
  pull_request:
    paths:
      - 'backend/app/routers/security_operations.py'
      - 'backend/scripts/collect_go_live_evidence.py'
      - 'backend/tests/test_soc_go_live_readiness.py'
      - 'backend/tests/test_soc_config.py'
      - 'backend/tests/test_soc_privacy.py'
      - 'backend/tests/test_audit_chain_p11.py'
      - 'backend/tests/test_audit_immutability_p11.py'
      - 'backend/tests/test_soc_runtime_security.py'
      - 'backend/tests/test_go_live_evidence_pack.py'
      - 'backend/tests/test_go_live_evidence_p11.py'
      - 'frontend/src/securityOperationsClient.ts'
      - 'frontend/src/components/NationalSecurityOperationsPanel.tsx'
      - 'frontend/tests/e2e/national-soc-security.spec.ts'
      - 'frontend/package-lock.json'
      - 'docs/P11_GO_LIVE_GATE.md'
      - '.github/workflows/p11-go-live-gate-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/routers/security_operations.py'
      - 'backend/scripts/collect_go_live_evidence.py'
      - 'backend/tests/test_soc_go_live_readiness.py'
      - 'backend/tests/test_soc_config.py'
      - 'backend/tests/test_soc_privacy.py'
      - 'backend/tests/test_audit_chain_p11.py'
      - 'backend/tests/test_audit_immutability_p11.py'
      - 'backend/tests/test_soc_runtime_security.py'
      - 'backend/tests/test_go_live_evidence_pack.py'
      - 'backend/tests/test_go_live_evidence_p11.py'
      - 'frontend/src/securityOperationsClient.ts'
      - 'frontend/src/components/NationalSecurityOperationsPanel.tsx'
      - 'frontend/tests/e2e/national-soc-security.spec.ts'
      - 'frontend/package-lock.json'
      - 'docs/P11_GO_LIVE_GATE.md'
      - '.github/workflows/p11-go-live-gate-ci.yml'
  workflow_dispatch:

jobs:
  p11-go-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt
      - name: Compile security and evidence modules
        working-directory: backend
        run: python -m compileall -q app/routers/security_operations.py app/soc_config.py app/audit_chain.py scripts/collect_go_live_evidence.py
      - name: Run P11 security and go-live regressions
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite+pysqlite:///:memory:
          AUTO_CREATE_TABLES: 'true'
          ENVIRONMENT: test
          SOC_ENABLED: 'false'
          AUDIT_CHAIN_ENABLED: 'false'
          EDGE_LEASE_SIGNING_SECRET: coderoute-p11-gate-edge-signing-secret-at-least-32-characters
          EDGE_RELEASE_SIGNING_SECRET: coderoute-p11-gate-release-signing-secret-at-least-32-characters
        run: |
          pytest -q --tb=short --disable-warnings \
            tests/test_soc_go_live_readiness.py \
            tests/test_soc_config.py \
            tests/test_soc_privacy.py \
            tests/test_audit_chain_p11.py \
            tests/test_audit_immutability_p11.py \
            tests/test_soc_runtime_security.py \
            tests/test_go_live_evidence_pack.py \
            tests/test_go_live_evidence_p11.py

  p11-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Reject high and critical npm vulnerabilities
        run: npm run audit:security
      - name: Typecheck security dashboard
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run P11 SOC and go-live E2E
        env:
          CI: 'true'
          VITE_API_BASE_URL: http://localhost:8000
        run: npx playwright test tests/e2e/national-soc-security.spec.ts --project=chromium --timeout=30000 --retries=1

  p11-gate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed controls remain explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          backend = Path('backend/app/routers/security_operations.py').read_text(encoding='utf-8')
          for marker in (
              'soc_enabled',
              'audit_hmac_enabled',
              'audit_chain_valid',
              'otel_enabled',
              'waf_enforced',
              'siem_enforced',
              'no_active_security_alert',
              'external_evidence_still_required',
          ):
              assert marker in backend, marker
          assert '"go_live": go_live' in backend

          collector = Path('backend/scripts/collect_go_live_evidence.py').read_text(encoding='utf-8')
          assert '"P11_SECURITY_GO_LIVE"' in collector
          assert 'security_go_live.get("ready") is True' in collector

          client = Path('frontend/src/securityOperationsClient.ts').read_text(encoding='utf-8')
          assert 'SecurityGoLiveControl' in client
          assert 'go_live?:' in client

          panel = Path('frontend/src/components/NationalSecurityOperationsPanel.tsx').read_text(encoding='utf-8')
          assert 'security-go-live-gate' in panel
          assert 'Go-live sécurité nationale' in panel
          assert 'Gate runtime prêt' in panel
          assert 'Go-live bloqué' in panel
          print('P11 go-live backend/frontend/evidence contract: OK')
          PY
