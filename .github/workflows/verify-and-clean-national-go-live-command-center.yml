name: Verify and Clean National Go-Live Command Center

on:
  pull_request:
    paths:
      - '.github/workflows/verify-and-clean-national-go-live-command-center.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-clean:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1

      - name: Verify final source and permanent CI contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          slash = chr(92)

          required_files = (
              'frontend/src/reliabilityClient.ts',
              'frontend/src/components/NationalGoLiveCommandCenter.tsx',
              'frontend/tests/e2e/national-go-live-command-center.spec.ts',
              '.github/workflows/national-code-readiness.yml',
              '.github/workflows/national-go-live-command-center-contract.yml',
          )
          for value in required_files:
              assert Path(value).exists(), value

          dashboard = Path('frontend/src/components/NationalDashboard.tsx').read_text(encoding='utf-8')
          assert dashboard.count("import { NationalGoLiveCommandCenter } from './NationalGoLiveCommandCenter';") == 1
          assert dashboard.count('<NationalGoLiveCommandCenter />') == 1
          assert '<NationalGoLiveCommandCenter />\n      <NationalGovernancePanel />' in dashboard

          component = Path('frontend/src/components/NationalGoLiveCommandCenter.tsx').read_text(encoding='utf-8')
          for marker in (
              'Promise.allSettled',
              'Readiness incomplète',
              'Gates automatisables prêts',
              'Décision institutionnelle toujours requise.',
              'pitr_drill_passed',
              'getSecurityOperationsStatus',
              'getGovernanceReadiness',
          ):
              assert marker in component, marker

          spec = Path('frontend/tests/e2e/national-go-live-command-center.spec.ts').read_text(encoding='utf-8')
          for marker in (
              'blockers without claiming institutional approval',
              'institutional sign-off remains mandatory',
              'fails closed when one readiness source is unavailable',
          ):
              assert marker in spec, marker

          readiness = Path('.github/workflows/national-code-readiness.yml').read_text(encoding='utf-8')
          for marker in (
              'tests/e2e/national-go-live-command-center.spec.ts',
              'tests/e2e/national-homologation-evidence.spec.ts',
              'tests/test_soc_go_live_readiness.py',
              'tests/test_go_live_evidence_pack.py',
              'tests/test_go_live_evidence_pitr.py',
              'tests/test_national_readiness_pitr.py',
              'tests/test_homologation_evidence_integrity.py',
          ):
              assert readiness.count(marker) == 1, (marker, readiness.count(marker))

          continuation_markers = (
              'tests/test_soc_runtime_security.py ' + slash + '\n            tests/test_soc_go_live_readiness.py ' + slash,
              'tests/test_soc_go_live_readiness.py ' + slash + '\n            tests/test_go_live_evidence_pack.py ' + slash,
              'tests/test_go_live_evidence_pack.py ' + slash + '\n            tests/test_go_live_evidence_pitr.py ' + slash,
              'tests/test_national_homologation.py ' + slash + '\n            tests/test_homologation_evidence_integrity.py',
          )
          for marker in continuation_markers:
              assert marker in readiness, marker

          contract = Path('.github/workflows/national-go-live-command-center-contract.yml').read_text(encoding='utf-8')
          assert 'temporary write-capable workflow leaked into deliverable' in contract
          print('Static national go-live contract verified.')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Reject high and critical npm vulnerabilities
        working-directory: frontend
        run: npm run audit:security

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run critical national browser regressions
        working-directory: frontend
        env:
          CI: 'true'
          VITE_API_BASE_URL: http://localhost:8000
        run: >-
          npx playwright test
          tests/e2e/edge-exam-bridge.spec.ts
          tests/e2e/national-soc-security.spec.ts
          tests/e2e/national-governance.spec.ts
          tests/e2e/national-homologation-evidence.spec.ts
          tests/e2e/national-go-live-command-center.spec.ts
          --project=chromium --timeout=30000 --retries=1

      - name: Record successful verification and remove temporary workflows
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p docs/verification
          cat > docs/verification/NATIONAL_GO_LIVE_COMMAND_CENTER.md <<EOF
          # National Go-Live Command Center — verification receipt

          This receipt is generated only after the dedicated verification workflow completes all preceding checks successfully.

          - source commit: \`${SOURCE_SHA}\`
          - verified at UTC: \`${VERIFIED_AT}\`
          - Node: 24
          - npm locked install: PASS
          - npm high/critical audit gate: PASS
          - TypeScript typecheck: PASS
          - production build: PASS
          - Edge exam bridge E2E: PASS
          - national SOC E2E: PASS
          - P12 governance E2E: PASS
          - hashed homologation evidence E2E: PASS
          - national go-live command center E2E: PASS

          Scope: automated software regression verification only. This receipt is **not** proof of PITR/WAF/SIEM operation and is **not** a DNTT homologation or institutional sign-off.
          EOF

          temp_files=(
            .github/workflows/go-live-command-center-ui-patch.yml
            .github/workflows/cleanup-go-live-command-center-ui-patch.yml
            .github/workflows/national-readiness-command-center-patch.yml
            .github/workflows/national-readiness-command-center-patch-v2.yml
            .github/workflows/cleanup-national-go-live-command-center.yml
            .github/workflows/command-center-resilience-patch.yml
            .github/workflows/final-cleanup-national-go-live-temp.yml
            .github/workflows/absolute-final-cleanup-go-live.yml
            .github/workflows/fix-national-readiness-shell-continuations.yml
            .github/workflows/fix-national-readiness-shell-continuations-v2.yml
            .github/workflows/definitive-cleanup-national-go-live.yml
            .github/workflows/verify-and-clean-national-go-live-command-center.yml
          )
          for file in "${temp_files[@]}"; do
            if [[ -f "$file" ]]; then
              git rm -f "$file"
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/NATIONAL_GO_LIVE_COMMAND_CENTER.md
          git commit -m 'test: record national go-live command-center verification'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
