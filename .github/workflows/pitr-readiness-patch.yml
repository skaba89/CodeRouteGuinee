name: PITR Readiness Source Patch

on:
  pull_request:
    paths:
      - '.github/workflows/pitr-readiness-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Apply one exact readiness change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/national_governance.py')
          text = path.read_text(encoding='utf-8')
          pitr_line = '        ("pitr_provider", "reliability.pitr_drill_passed", timedelta(days=35)),\n'
          anchor = '        ("api_failover", "reliability.ha_failover_probe_passed", timedelta(days=35)),\n'
          if pitr_line in text:
              print('PITR readiness already present')
          elif text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one api_failover anchor, found {text.count(anchor)}')
          else:
              path.write_text(text.replace(anchor, pitr_line + anchor, 1), encoding='utf-8')
              print('PITR readiness gate inserted')
          PY
      - name: Verify diff scope
        shell: bash
        run: |
          git diff -- backend/app/national_governance.py
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/app/national_governance.py').read_text(encoding='utf-8')
          assert text.count('reliability.pitr_drill_passed') == 1
          assert '("pitr_provider", "reliability.pitr_drill_passed", timedelta(days=35))' in text
          PY
      - name: Commit exact source patch
        shell: bash
        run: |
          if git diff --quiet -- backend/app/national_governance.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/national_governance.py
          git commit -m 'governance: require fresh PITR evidence for national readiness'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
