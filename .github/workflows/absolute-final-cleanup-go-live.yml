name: Absolute Final Cleanup Go-Live Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/absolute-final-cleanup-go-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Verify complete deliverable before deleting temporary workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('frontend/src/components/NationalDashboard.tsx').read_text(encoding='utf-8')
          assert dashboard.count("import { NationalGoLiveCommandCenter } from './NationalGoLiveCommandCenter';") == 1
          assert dashboard.count('<NationalGoLiveCommandCenter />') == 1

          component = Path('frontend/src/components/NationalGoLiveCommandCenter.tsx').read_text(encoding='utf-8')
          for marker in ('Promise.allSettled', 'Readiness incomplète', 'Décision institutionnelle toujours requise.'):
              assert marker in component, marker

          contract = Path('.github/workflows/national-go-live-command-center-contract.yml').read_text(encoding='utf-8')
          assert 'temporary write-capable workflow leaked into deliverable' in contract
          assert 'National Go-Live Command Center contract: OK' in contract

          readiness = Path('.github/workflows/national-code-readiness.yml').read_text(encoding='utf-8')
          for marker in (
              'tests/e2e/national-go-live-command-center.spec.ts',
              'tests/e2e/national-homologation-evidence.spec.ts',
              'tests/test_soc_go_live_readiness.py',
              'tests/test_go_live_evidence_pack.py',
              'tests/test_go_live_evidence_pitr.py',
              'tests/test_national_readiness_pitr.py',
              'tests/test_homologation_evidence_integrity.py',
          ):
              assert readiness.count(marker) == 1, (marker, readiness.count(marker))
          print('Complete deliverable verified. Temporary workflow cleanup authorized.')
          PY
      - name: Delete every temporary write-capable workflow from this feature
        shell: bash
        run: |
          files=(
            .github/workflows/go-live-command-center-ui-patch.yml
            .github/workflows/cleanup-go-live-command-center-ui-patch.yml
            .github/workflows/national-readiness-command-center-patch.yml
            .github/workflows/national-readiness-command-center-patch-v2.yml
            .github/workflows/cleanup-national-go-live-command-center.yml
            .github/workflows/command-center-resilience-patch.yml
            .github/workflows/final-cleanup-national-go-live-temp.yml
            .github/workflows/absolute-final-cleanup-go-live.yml
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              git rm -f "$file"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: finalize national go-live workflow hygiene'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
