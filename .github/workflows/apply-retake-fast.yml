name: Apply Retake Patch Fast

on:
  push:
    branches:
      - agent/institutional-retake-trace-p0-v2
    paths:
      - .github/workflows/apply-retake-fast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/institutional-retake-trace-p0-v2

      - name: Patch exact code paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return text.replace(old, new, 1)

          exams_path = Path('backend/app/routers/exams.py')
          exams = exams_path.read_text()
          exams = one(
              exams,
              'from app.exam_attempt_locking import find_recoverable_attempt, lock_exam_attempt\n',
              'from app.exam_attempt_locking import RECOVERABLE_ATTEMPT_STATUSES, find_latest_attempt, lock_exam_attempt\n',
              'import',
          )
          exams = one(
              exams,
              'def _create_exam_attempt(db: Session, candidate_id: str, session_id: str) -> ExamAttempt:\n',
              'def _create_exam_attempt(\n    db: Session, candidate_id: str, session_id: str, *, commit: bool = True\n) -> ExamAttempt:\n',
              'factory signature',
          )
          factory_start = exams.index('def _create_exam_attempt(')
          factory_end = exams.index('\ndef _register_exam_start_device(', factory_start)
          factory = exams[factory_start:factory_end]
          factory = one(
              factory,
              '    db.commit()\n    db.refresh(attempt)\n    return attempt\n',
              '    if commit:\n        db.commit()\n        db.refresh(attempt)\n    else:\n        db.flush()\n    return attempt\n',
              'factory commit',
          )
          exams = exams[:factory_start] + factory + exams[factory_end:]

          old = '''    existing_attempt = find_recoverable_attempt(db, booking.candidate_id, booking.session_id)\n    if existing_attempt is not None:\n        _assert_attempt_access(db, current_user, existing_attempt)\n        _register_exam_start_device(\n            db, existing_attempt, session, payload.device_key, payload.device_label\n        )\n        db.add(\n            AuditLog(\n                actor_id=current_user.id,\n                action="exam.attempt_resumed",\n                entity="exam_attempt",\n                entity_id=existing_attempt.id,\n                details={\n                    "booking_reference": booking.reference,\n                    "candidate_id": booking.candidate_id,\n                    "session_id": booking.session_id,\n                    "attempt_status": existing_attempt.status,\n                    "recovery_mode": "booking_retry_or_device_replacement",\n                },\n            )\n        )\n        db.commit()\n        db.refresh(existing_attempt)\n        return existing_attempt\n\n    attempt = _create_exam_attempt(db, booking.candidate_id, booking.session_id)\n'''
          new = '''    latest_attempt = find_latest_attempt(db, booking.candidate_id, booking.session_id)\n    if latest_attempt is not None and latest_attempt.status in RECOVERABLE_ATTEMPT_STATUSES:\n        _assert_attempt_access(db, current_user, latest_attempt)\n        _register_exam_start_device(\n            db, latest_attempt, session, payload.device_key, payload.device_label\n        )\n        db.add(\n            AuditLog(\n                actor_id=current_user.id,\n                action="exam.attempt_resumed",\n                entity="exam_attempt",\n                entity_id=latest_attempt.id,\n                details={\n                    "booking_reference": booking.reference,\n                    "candidate_id": booking.candidate_id,\n                    "session_id": booking.session_id,\n                    "attempt_status": latest_attempt.status,\n                    "recovery_mode": "booking_retry_or_device_replacement",\n                },\n            )\n        )\n        db.commit()\n        db.refresh(latest_attempt)\n        return latest_attempt\n\n    if latest_attempt is not None:\n        code = "EXAM_ATTEMPT_BLOCKED_BY_INCIDENT" if latest_attempt.status == "incident_blocked" else "BOOKING_ALREADY_USED_FOR_EXAM"\n        message = (\n            "Cette tentative est bloquée par un incident. Une décision administrateur est requise."\n            if latest_attempt.status == "incident_blocked"\n            else "Cette réservation a déjà été utilisée pour un examen. Un nouveau passage exige un rattrapage institutionnel autorisé."\n        )\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail={\n                "code": code,\n                "message": message,\n                "attempt_id": latest_attempt.id,\n                "attempt_status": latest_attempt.status,\n            },\n        )\n\n    attempt = _create_exam_attempt(db, booking.candidate_id, booking.session_id)\n'''
          exams = one(exams, old, new, 'booking guard')
          exams_path.write_text(exams)

          incident_path = Path('backend/app/routers/center_incidents.py')
          incident = incident_path.read_text()
          incident = one(
              incident,
              '''    if payload.allow_retake and attempt:\n        if attempt.status not in {"incident_blocked", "started", "expired"}:\n            raise HTTPException(status_code=status.HTTP_409_CONFLICT, detail="Attempt is not eligible for retake")\n        attempt.status = "cancelled_by_incident"\n        attempt.submitted_at = now\n        new_attempt = ExamAttempt(candidate_id=attempt.candidate_id, session_id=attempt.session_id)\n        db.add(attempt)\n        db.add(new_attempt)\n        db.flush()\n        incident.new_attempt_id = new_attempt.id\n''',
              '''    if payload.allow_retake and attempt:\n        if attempt.status not in {"incident_blocked", "started", "expired"}:\n            raise HTTPException(status_code=status.HTTP_409_CONFLICT, detail="Attempt is not eligible for retake")\n\n        # Crée un vrai nouvel examen officiel avec sa propre trace, sans\n        # commit intermédiaire : la résolution et le rattrapage restent atomiques.\n        from app.routers.exams import _create_exam_attempt\n\n        new_attempt = _create_exam_attempt(\n            db, attempt.candidate_id, attempt.session_id, commit=False\n        )\n        attempt.status = "cancelled_by_incident"\n        attempt.submitted_at = now\n        db.add(attempt)\n        db.flush()\n        incident.new_attempt_id = new_attempt.id\n''',
              'incident retake',
          )
          incident_path.write_text(incident)
          PY

      - name: Compile patched Python
        run: python3 -m compileall -q backend/app

      - name: Commit and clean temporary workflows
        run: |
          git rm -f .github/workflows/apply-retake-fast.yml .github/workflows/apply-retake-trace-patch.yml
          git config user.name "CodeRoute Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/routers/exams.py backend/app/routers/center_incidents.py
          git commit -m "fix: create traced official attempts for authorized retakes"
          git push origin HEAD:agent/institutional-retake-trace-p0-v2
