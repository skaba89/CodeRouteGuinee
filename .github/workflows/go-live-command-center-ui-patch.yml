name: Go-Live Command Center UI Patch

on:
  pull_request:
    paths:
      - '.github/workflows/go-live-command-center-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Integrate command center exactly once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/NationalDashboard.tsx')
          text = path.read_text(encoding='utf-8')
          import_anchor = "import { NationalGovernancePanel } from './NationalGovernancePanel';\n"
          import_line = "import { NationalGoLiveCommandCenter } from './NationalGoLiveCommandCenter';\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('governance import anchor missing/duplicated')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          render_anchor = '      <NationalGovernancePanel />\n'
          render_line = '      <NationalGoLiveCommandCenter />\n'
          if render_line not in text:
              if text.count(render_anchor) != 1:
                  raise SystemExit('governance render anchor missing/duplicated')
              text = text.replace(render_anchor, render_line + render_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify exact diff
        shell: bash
        run: |
          git diff -- frontend/src/components/NationalDashboard.tsx
          python - <<'PY'
          from pathlib import Path
          text = Path('frontend/src/components/NationalDashboard.tsx').read_text(encoding='utf-8')
          assert text.count("import { NationalGoLiveCommandCenter } from './NationalGoLiveCommandCenter';") == 1
          assert text.count('<NationalGoLiveCommandCenter />') == 1
          assert '<NationalGoLiveCommandCenter />\n      <NationalGovernancePanel />' in text
          PY
      - name: Commit dashboard integration
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/components/NationalDashboard.tsx; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/NationalDashboard.tsx
          git commit -m 'frontend: integrate national go-live command center'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
