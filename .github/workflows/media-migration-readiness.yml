name: Media Migration Readiness

on:
  pull_request:
    paths:
      - 'backend/app/media_*.py'
      - 'backend/app/models_media.py'
      - 'backend/app/schemas_media*.py'
      - 'backend/app/routers/media_*.py'
      - 'backend/app/routers/exam_media_guard.py'
      - 'backend/app/routers/__init__.py'
      - 'backend/tests/test_media_*.py'
      - 'frontend/src/**/Media*.tsx'
      - 'frontend/src/**/ExamMedia*.tsx'
      - 'frontend/src/media*.ts'
      - 'frontend/src/pages/exam.tsx'
      - 'frontend/src/pages/media-library*.tsx'
      - 'frontend/vite.config.ts'
      - 'frontend/public/media/exam/guinea/**'
      - 'frontend/tests/e2e/media-*.spec.ts'
      - '.github/workflows/media-migration-readiness.yml'
  push:
    branches:
      - '**'
    paths:
      - 'backend/app/media_*.py'
      - 'backend/app/models_media.py'
      - 'backend/app/schemas_media*.py'
      - 'backend/app/routers/media_*.py'
      - 'backend/app/routers/exam_media_guard.py'
      - 'backend/app/routers/__init__.py'
      - 'backend/tests/test_media_*.py'
      - 'frontend/src/**/Media*.tsx'
      - 'frontend/src/**/ExamMedia*.tsx'
      - 'frontend/src/media*.ts'
      - 'frontend/src/pages/exam.tsx'
      - 'frontend/src/pages/media-library*.tsx'
      - 'frontend/vite.config.ts'
      - 'frontend/public/media/exam/guinea/**'
      - 'frontend/tests/e2e/media-*.spec.ts'
      - '.github/workflows/media-migration-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt

      - name: Run backend media regression contracts
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite+pysqlite:///:memory:'
          AUTO_CREATE_TABLES: 'true'
          ENVIRONMENT: test
          SOC_ENABLED: 'false'
          AUDIT_CHAIN_ENABLED: 'false'
          EDGE_LEASE_SIGNING_SECRET: coderoute-media-readiness-edge-signing-secret-at-least-32-characters
          EDGE_RELEASE_SIGNING_SECRET: coderoute-media-readiness-release-signing-secret-at-least-32-characters
        run: |
          python -m compileall -q app
          pytest -q --tb=short --disable-warnings tests/test_database_migrations.py tests/test_media_*.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit, typecheck and production build
        working-directory: frontend
        run: |
          npm run audit:security
          npm run typecheck
          npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Media library, migration and candidate media E2E
        working-directory: frontend
        env:
          CI: 'true'
          VITE_API_BASE_URL: http://localhost:8000
        run: >-
          npx playwright test
          tests/e2e/media-library.spec.ts
          tests/e2e/media-migration-workflow.spec.ts
          tests/e2e/media-exam-visible.spec.ts
          --project=chromium --timeout=30000 --retries=1
