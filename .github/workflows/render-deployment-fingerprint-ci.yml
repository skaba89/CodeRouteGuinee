name: Render Deployment Fingerprint CI

on:
  pull_request:
    paths:
      - 'backend/app/routers/health.py'
      - 'backend/scripts/verify_render_deployment.py'
      - 'backend/tests/test_health.py'
      - 'backend/tests/test_render_deployment_fingerprint.py'
      - 'render.yaml'
      - '.github/workflows/verify-render-deployment.yml'
      - '.github/workflows/render-deployment-fingerprint-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/routers/health.py'
      - 'backend/scripts/verify_render_deployment.py'
      - 'backend/tests/test_health.py'
      - 'backend/tests/test_render_deployment_fingerprint.py'
      - 'render.yaml'
      - '.github/workflows/verify-render-deployment.yml'
      - '.github/workflows/render-deployment-fingerprint-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt
      - name: Compile health and deployment verifier when present
        working-directory: backend
        shell: bash
        run: |
          python -m compileall -q app/routers/health.py
          if [[ -f scripts/verify_render_deployment.py ]]; then
            python -m compileall -q scripts/verify_render_deployment.py
          fi
      - name: Run deployment identity regressions
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite+pysqlite:///:memory:'
          AUTO_CREATE_TABLES: 'true'
          ENVIRONMENT: test
          SOC_ENABLED: 'false'
          AUDIT_CHAIN_ENABLED: 'false'
          EDGE_LEASE_SIGNING_SECRET: coderoute-render-ci-edge-signing-secret-at-least-32-characters
          EDGE_RELEASE_SIGNING_SECRET: coderoute-render-ci-release-signing-secret-at-least-32-characters
        shell: bash
        run: |
          tests=(tests/test_health.py)
          if [[ -f tests/test_render_deployment_fingerprint.py ]]; then
            tests+=(tests/test_render_deployment_fingerprint.py)
          fi
          pytest -q --tb=short --disable-warnings "${tests[@]}"

  blueprint-cd-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: pip install -q PyYAML
      - name: Validate native Render identity, checks-pass CD and safe post-deploy proof contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          render = yaml.safe_load(Path('render.yaml').read_text(encoding='utf-8'))
          services = {item['name']: item for item in render['services']}
          backend = services['coderouteguinee-backend']
          backup = services['coderoute-offsite-backup']
          frontend = services['coderouteguinee-frontend']

          backend_url = 'https://coderouteguinee-backend.onrender.com'
          frontend_url = 'https://coderouteguinee-frontend.onrender.com'

          assert backend['healthCheckPath'] == '/health/readiness'
          assert backend['numInstances'] == 2
          env = {item['key']: item for item in backend.get('envVars', []) if 'key' in item}
          for render_native in ('RENDER_GIT_COMMIT', 'RENDER_GIT_BRANCH', 'RENDER_GIT_REPO_SLUG'):
              assert render_native not in env, f'{render_native} must remain Render-provided and must not be overridden'

          assert env['CORS_ORIGINS']['value'] == frontend_url
          assert env['ALLOWED_HOSTS']['value'] == 'coderouteguinee-backend.onrender.com'

          backup_env = {item['key']: item for item in backup.get('envVars', []) if 'key' in item}
          assert backup_env['CODEROUTE_API_BASE_URL']['value'] == backend_url
          reliability_ref = backup_env['RELIABILITY_EVIDENCE_TOKEN']['fromService']
          assert reliability_ref['type'] == 'web'
          assert reliability_ref['name'] == 'coderouteguinee-backend'

          frontend_env = {item['key']: item for item in frontend.get('envVars', []) if 'key' in item}
          assert frontend_env['VITE_API_BASE_URL']['value'] == backend_url

          health = Path('backend/app/routers/health.py').read_text(encoding='utf-8')
          for marker in ('RENDER_GIT_COMMIT', 'RENDER_GIT_BRANCH', 'RENDER_GIT_REPO_SLUG', 'git_commit'):
              assert marker in health, marker

          verifier_path = Path('backend/scripts/verify_render_deployment.py')
          if not verifier_path.exists():
              print('Render fingerprint verifier not delivered yet; permanent CI gate installed.')
              raise SystemExit(0)

          for service in (backend, backup, frontend):
              assert service.get('autoDeployTrigger') == 'checksPass', service['name']

          verifier = verifier_path.read_text(encoding='utf-8')
          for marker in ('DEPLOYED_SHA_MATCH', 'RENDER_GIT_COMMIT_PRESENT', 'coderoute_render_deployment_receipt_v1'):
              assert marker in verifier, marker

          runtime_workflow = Path('.github/workflows/verify-render-deployment.yml').read_text(encoding='utf-8')
          for marker in (
              'repository_dispatch:',
              '- render_deploy_ended',
              'github.event.client_payload.commit_sha',
              "github.event.client_payload.status == 'succeeded'",
              "github.event.client_payload.service_name == 'coderouteguinee-backend'",
              'max_rounds=12',
              'render-deployment-receipt-',
          ):
              assert marker in runtime_workflow, marker
          assert 'workflow_run:' not in runtime_workflow, 'workflow_run would risk a checksPass deploy verification cycle'
          assert 'https://coderouteguinee-backend.onrender.com' in runtime_workflow

          print('Render deployment fingerprint + safe post-deploy dispatch contract: OK')
          PY
