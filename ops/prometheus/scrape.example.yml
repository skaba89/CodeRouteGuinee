scrape_configs:
  - job_name: coderoute-backend
    scheme: https
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/coderoute_metrics_token
    static_configs:
      - targets:
          - coderouteguinee-backend.onrender.com
        labels:
          environment: production
          country: GN
